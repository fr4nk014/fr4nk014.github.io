<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PearlByte</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(0deg, #ffb640 0%, #ffb812 100%);
            color: #7d5434;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .screenshot-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .screenshot-backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 184, 48, 0.58);
        }

        .screenshot-track {
            position: absolute;
            display: flex;
            width: max-content;
            animation: scroll-screenshots 100s linear infinite;
        }

        .screenshot-track--top {
            top: 2%;
        }

        .screenshot-track--bottom {
            bottom: 2%;
            animation-direction: reverse;
            animation-duration: 120s;
        }

        .screenshot-group {
            display: flex;
            gap: 16px;
            padding-right: 16px;
        }

        .screenshot-group img {
            display: block;
            width: clamp(200px, 26vw, 400px);
            height: clamp(90px, 16vh, 190px);
            border-radius: 12px;
            object-fit: cover;
            opacity: 0.55;
        }

        @keyframes scroll-screenshots {
            to {
                transform: translateX(-50%);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 600px);
            padding: 8px 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.8rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -2px;
            color: #9a642f;
        }

        .title-letter {
            display: inline-block;
            text-shadow: 2px 2px 0 rgba(255, 221, 145, 0.7), -2px -2px 3px rgba(111, 66, 25, 0.28);
            animation: title-wave 2.4s ease-in-out infinite;
        }

        .title-letter:nth-child(2) {
            animation-delay: 0.12s;
        }

        .title-letter:nth-child(3) {
            animation-delay: 0.24s;
        }

        .title-letter:nth-child(4) {
            animation-delay: 0.36s;
        }

        .title-letter:nth-child(5) {
            animation-delay: 0.48s;
        }

        .title-letter:nth-child(6) {
            animation-delay: 0.6s;
        }

        .title-letter:nth-child(7) {
            animation-delay: 0.72s;
        }

        .title-letter:nth-child(8) {
            animation-delay: 0.84s;
        }

        .title-letter:nth-child(9) {
            animation-delay: 0.96s;
        }

        @keyframes title-wave {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        p {
            margin: 0 0 14px;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .games {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .link-panel {
            width: min(100%, 460px);
            margin: 12px auto 0;
            padding: 12px;
            border: 1px solid rgba(87, 55, 31, 0.62);
            border-radius: 16px;
            background: rgba(112, 73, 42, 0.88);
            box-shadow: inset 3px 3px 8px rgba(57, 36, 21, 0.46), inset -3px -3px 7px rgba(255, 220, 163, 0.2);
            backdrop-filter: blur(8px);
        }

        .link-panel h2 {
            margin: 0 0 8px;
            color: #fff0cf;
            font-size: 1rem;
        }

        .discord-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(100%, 360px);
            margin: 0 auto;
            padding: 10px;
            border-radius: 12px;
            background: #232428;
            color: #f2f3f5;
            text-align: left;
            box-shadow: 0 8px 24px rgba(55, 36, 20, 0.28);
        }

        .discord-icon {
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            border-radius: 16px;
            object-fit: cover;
        }

        .discord-details {
            min-width: 0;
            flex: 1;
        }

        .discord-name {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .discord-counts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #b5bac1;
            font-size: 0.8rem;
        }

        .discord-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .discord-count::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #80848e;
        }

        .discord-count--online::before {
            background: #23a55a;
        }

        .discord-join {
            flex: 0 0 auto;
            padding: 9px 13px;
            border-radius: 5px;
            background: #5865f2;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .discord-join:hover {
            background: #4752c4;
        }

        .game-link {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 12px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.62) 30%, rgba(255, 255, 255, 0.22) 100%), rgba(255, 214, 126, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.88);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.95), inset 0 -2px 0 rgba(156, 93, 35, 0.12), 0 5px 0 rgba(156, 93, 35, 0.32), 0 8px 14px rgba(107, 77, 55, 0.16);
            color: #4f2e0d;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .game-link:hover {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.72) 34%, rgba(255, 255, 255, 0.3) 100%), rgba(255, 214, 126, 0.58);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 1), inset 0 -2px 0 rgba(156, 93, 35, 0.12), 0 5px 0 rgba(156, 93, 35, 0.32), 0 10px 16px rgba(107, 77, 55, 0.2);
            transform: translateY(-2px);
        }

        @media (prefers-reduced-motion: reduce) {
            .screenshot-track {
                animation: none;
            }

            .title-letter {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <main class="container">

            <span class="title-letter" aria-hidden="true">a</span>

        </h1>

        <p>Website Under Construction.</p>

                <a class="game-link" href="https://store.steampowered.com/app/2536120/Mousey/" target="_blank"

                    rel="noopener noreferrer">

                </a>

        </section>

        <section class="link-panel" aria-labelledby="discord-heading">
            <h2 id="discord-heading">Join the Discord Server</h2>
            <div class="discord-card" aria-label="Discord server invite">
                <img class="discord-icon"
                    src="https://cdn.discordapp.com/icons/929065007478620170/5c4990c14b597fa95c43c633315ff43a.png?size=128"
                    alt="" />
                <div class="discord-details">
                    <span class="discord-name">PearlByte</span>
                    <div class="discord-counts" aria-live="polite">
                        <span class="discord-count" id="discord-members">Loading members...</span>
                        <span class="discord-count discord-count--online" id="discord-online">Loading online...</span>
                    </div>
                </div>
                <a class="discord-join" href="https://discord.gg/7R7YTwwKHz" target="_blank" rel="noopener noreferrer">
                    Join
                </a>
            </div>
        </section>
    </main>

    <script>
        fetch("https://discord.com/api/v10/invites/7R7YTwwKHz?with_counts=true")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Discord invite request failed (${response.status}).`);
                }
                return response.json();
            })
            .then((invite) => {
                const members = invite.approximate_member_count;
                const online = invite.approximate_presence_count;

                if (!Number.isFinite(members) || !Number.isFinite(online)) {
                    throw new Error("Discord did not return member counts for this invite.");
                }

                document.getElementById("discord-members").textContent = `${members} Members`;
                document.getElementById("discord-online").textContent = `${online} Online`;
            })
            .catch((error) => {
                console.error("Unable to load Discord member counts:", error);
                document.getElementById("discord-members").textContent = "Member count unavailable";
                document.getElementById("discord-online").remove();
            });
    </script>
