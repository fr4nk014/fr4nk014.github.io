<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="google-site-verification" content="epV0pDgQTz8TOZvZEdTZ5ht3b9MqIsFBmiNYhWLpEHo" />

    <title>PearlByte</title>

    <style>
        :root {
            --ease-out-back: cubic-bezier(0.34, 1.35, 0.64, 1);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(0deg, #ffb640 0%, #ffb812 100%);
            color: #7d5434;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 2;
            background: #000;
            pointer-events: none;
            opacity: 1;
        }

        body.is-ready::before {
            animation: fade-from-black 1.2s ease-out forwards;
        }

        @keyframes fade-from-black {
            to {
                opacity: 0;
            }
        }

        .screenshot-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .screenshot-backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 184, 48, 0.58);
        }

        .screenshot-track {
            position: absolute;
            display: flex;
            width: max-content;
            animation: scroll-screenshots 48s linear infinite;
            animation-play-state: paused;
        }

        body.is-ready .screenshot-track {
            animation-play-state: running;
        }

        .screenshot-track--top {
            top: 2%;
            --entry-x: -110vw;
            --entry-rotation: -9deg;
        }

        .screenshot-track--bottom {
            bottom: 2%;
            animation-name: scroll-screenshots-reverse;
            animation-duration: 56s;
            --entry-x: 110vw;
            --entry-rotation: 9deg;
        }

        .screenshot-group {
            display: flex;
            flex: 0 0 100vw;
            gap: 16px;
            padding-right: 16px;
        }

        .screenshot-group img {
            display: block;
            flex: 1 1 0;
            width: 0;
            min-width: 0;
            height: clamp(90px, 16vh, 190px);
            border-radius: 12px;
            object-fit: cover;
            opacity: 0.55;
        }

        body.is-ready .screenshot-group img {
            animation: screenshot-arrive 1.15s var(--ease-out-back) both;
            animation-delay: var(--image-delay, 0s);
        }

        .screenshot-group img:nth-child(2) {
            --image-delay: 0.12s;
        }

        .screenshot-group img:nth-child(3) {
            --image-delay: 0.24s;
        }

        @keyframes screenshot-arrive {
            0% {
                transform: translateX(var(--entry-x)) scale(0.7) rotate(var(--entry-rotation));
                opacity: 0;
            }

            100% {
                transform: translateX(0) scale(1) rotate(0);
                opacity: 0.55;
            }
        }

        @keyframes scroll-screenshots {
            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(-50%, 0, 0);
            }
        }

        @keyframes scroll-screenshots-reverse {
            from {
                transform: translate3d(-50%, 0, 0);
            }

            to {
                transform: translate3d(0, 0, 0);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 600px);
            padding: 8px 20px;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0 0 2px;
            font-size: clamp(2rem, 9vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.07em;
            color: #9a642f;
            white-space: nowrap;
        }

        .title-prefix {
            display: block;
        }

        .title-letters {
            display: flex;
        }

        .title-ending {
            display: flex;
        }

        .title-letter {
            display: inline-block;
            animation: title-wave 2.4s ease-in-out infinite;
            animation-delay: var(--letter-delay, 0s);
            will-change: transform;
        }

        .title-arrival {
            display: inline-block;
        }

        body.is-ready .title-arrival {
            animation: title-arrive 1s var(--ease-out-back) both;
            animation-delay: var(--arrival-delay, 0s);
        }

        .title-arrival:nth-child(2) {
            --arrival-delay: 0.06s;
            --arrival-x: -85vw;
            --arrival-y: -35vh;
            --arrival-rotation: -16deg;
        }

        .title-arrival:nth-child(3) {
            --arrival-delay: 0.12s;
            --arrival-x: 0;
            --arrival-y: 90vh;
            --arrival-rotation: 13deg;
        }

        .title-arrival:nth-child(4) {
            --arrival-delay: 0.18s;
            --arrival-x: 90vw;
            --arrival-y: -20vh;
            --arrival-rotation: 18deg;
        }

        .title-arrival:nth-child(5) {
            --arrival-delay: 0.24s;
            --arrival-x: -70vw;
            --arrival-y: 55vh;
            --arrival-rotation: -12deg;
        }

        .title-arrival:nth-child(6) {
            --arrival-delay: 0.3s;
            --arrival-x: 75vw;
            --arrival-y: 45vh;
            --arrival-rotation: 14deg;
        }

        @keyframes title-arrive {
            0% {
                opacity: 0;
                transform: translate(var(--arrival-x, 0), var(--arrival-y, -80vh)) scale(0.3) rotate(var(--arrival-rotation, 12deg));
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0);
            }
        }

        .title-letters .title-arrival:nth-child(2) {
            --letter-delay: 0.12s;
        }

        .title-letters .title-arrival:nth-child(3) {
            --letter-delay: 0.24s;
        }

        .title-letters .title-arrival:nth-child(4) {
            --letter-delay: 0.36s;
        }

        .title-letters .title-arrival:nth-child(5) {
            --letter-delay: 0.48s;
        }

        .title-letters .title-arrival:nth-child(6) {
            --letter-delay: 0.6s;
        }

        .title-ending .title-arrival:nth-child(1) {
            --letter-delay: 0.72s;
        }

        .title-ending .title-arrival:nth-child(2) {
            --letter-delay: 0.84s;
        }

        .title-ending .title-arrival:nth-child(3) {
            --letter-delay: 0.96s;
        }

        .title-character {
            display: inline-block;
            text-shadow: 2px 2px 0 rgba(255, 221, 145, 0.7), -2px -2px 3px rgba(111, 66, 25, 0.28);
            animation: title-pulse 5s ease-in-out infinite;
            animation-delay: var(--letter-delay, 0s);
        }

        @keyframes title-wave {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(0, -6px, 0);
            }
        }

        @keyframes title-pulse {

            0%,
            4%,
            10%,
            100% {
                transform: scale3d(1, 1, 1);
            }

            7% {
                transform: scale3d(1.2, 1.2, 1);
            }
        }

        .tagline {
            margin: 0 0 8px;
            color: #9a642f;
            font-size: clamp(0.8rem, 3vw, 1.1rem);
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(255, 221, 145, 0.7), -2px -2px 3px rgba(111, 66, 25, 0.28);
        }

        body.is-ready .tagline {
            animation: pop-in 0.9s var(--ease-out-back) 0.42s both;
        }

        body.is-ready .construction-note {
            animation: pop-in 0.9s var(--ease-out-back) 0.52s both;
        }

        @keyframes pop-in {
            0% {
                opacity: 0;
                transform: translateY(80vh) scale(0.55) rotate(-5deg);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0);
            }
        }

        p {
            margin: 0 0 14px;
            font-size: 1.2rem;
            opacity: 0.9;
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }

        .games {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .link-panel {
            width: min(100%, 460px);
            margin: 12px auto 0;
            padding: 12px;
            border: 1px solid rgba(87, 55, 31, 0.62);
            border-radius: 16px;
            background: rgba(112, 73, 42, 0.88);
            box-shadow: inset 3px 3px 8px rgba(57, 36, 21, 0.46), inset -3px -3px 7px rgba(255, 220, 163, 0.2);
            backdrop-filter: blur(8px);
        }

        .link-panel:first-of-type {
            --panel-entry-x: -110vw;
            --panel-entry-rotation: -8deg;
            --panel-delay: 0.62s;
        }

        .link-panel:last-of-type {
            --panel-entry-x: 110vw;
            --panel-entry-rotation: 8deg;
            --panel-delay: 0.74s;
        }

        body.is-ready .link-panel {
            animation: panel-arrive 1s var(--ease-out-back) var(--panel-delay) both;
        }

        @keyframes panel-arrive {
            0% {
                opacity: 0;
                transform: translateX(var(--panel-entry-x)) scale(0.7) rotate(var(--panel-entry-rotation));
            }

            100% {
                opacity: 1;
                transform: translateX(0) scale(1) rotate(0);
            }
        }

        .link-panel h2 {
            margin: 0 0 8px;
            color: #fff0cf;
            font-size: 1rem;
        }

        .discord-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(100%, 360px);
            margin: 0 auto;
            padding: 10px;
            border-radius: 12px;
            background: #232428;
            color: #f2f3f5;
            text-align: left;
            box-shadow: 0 8px 24px rgba(55, 36, 20, 0.28);
        }

        .discord-icon {
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            border-radius: 16px;
            object-fit: cover;
        }

        .discord-details {
            min-width: 0;
            flex: 1;
        }

        .discord-name {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .discord-counts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            color: #b5bac1;
            font-size: 0.8rem;
        }

        .discord-count {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .discord-count::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #80848e;
        }

        .discord-count--online::before {
            background: #23a55a;
        }

        .discord-join {
            flex: 0 0 auto;
            padding: 9px 13px;
            border-radius: 5px;
            background: #5865f2;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .discord-join:hover {
            background: #4752c4;
        }

        .game-link {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 12px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.62) 30%, rgba(255, 255, 255, 0.22) 100%), rgba(255, 214, 126, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.88);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.95), inset 0 -2px 0 rgba(156, 93, 35, 0.12), 0 5px 0 rgba(156, 93, 35, 0.32), 0 8px 14px rgba(107, 77, 55, 0.16);
            color: #4f2e0d;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
            backdrop-filter: blur(5px);
        }

        .game-link:hover {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0.72) 34%, rgba(255, 255, 255, 0.3) 100%), rgba(255, 214, 126, 0.58);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, 1), inset 0 -2px 0 rgba(156, 93, 35, 0.12), 0 5px 0 rgba(156, 93, 35, 0.32), 0 10px 16px rgba(107, 77, 55, 0.2);
            transform: translateY(-2px);
        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                display: none;
            }

            .screenshot-track {
                animation: none;
                transform: none;
            }

            .title-letter,
            .title-character {
                animation: none;
            }

            body.is-ready .screenshot-group img,
            body.is-ready .title-arrival,
            body.is-ready .tagline,
            body.is-ready .construction-note,
            body.is-ready .link-panel {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="screenshot-backdrop" aria-hidden="true">
        <div class="screenshot-track screenshot-track--top">
            <div class="screenshot-group">
                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2536120/ss_e4531625b7780801ce9607ab07ecff13b1998bfc.600x338.jpg?t=1759147006"

                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2536120/ss_d9f8987ab2d6ade736bb558321d5818aba7851f0.600x338.jpg?t=1759147006"

            </div>
            <div class="screenshot-group">

                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2536120/ss_d9f8987ab2d6ade736bb558321d5818aba7851f0.600x338.jpg?t=1759147006"

        <div class="screenshot-track screenshot-track--bottom">
            <div class="screenshot-group">

                    alt="" />
                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4025210/773b8e3f1b7fd6adbd0893e0771ce68a0ff39bed/ss_773b8e3f1b7fd6adbd0893e0771ce68a0ff39bed.600x338.jpg?t=1780767696"
                    alt="" />
                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4025210/dba4a3b3212b28345a5b2050d3a1d096a20e986f/ss_dba4a3b3212b28345a5b2050d3a1d096a20e986f.600x338.jpg?t=1780767696"
                    alt="" />
            </div>
            <div class="screenshot-group">
                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4025210/4e67e53bb069f2fb571076aabaa07d2f0e735a94/ss_4e67e53bb069f2fb571076aabaa07d2f0e735a94.600x338.jpg?t=1780767696"

                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4025210/773b8e3f1b7fd6adbd0893e0771ce68a0ff39bed/ss_773b8e3f1b7fd6adbd0893e0771ce68a0ff39bed.600x338.jpg?t=1780767696"
                    alt="" />
                <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/4025210/dba4a3b3212b28345a5b2050d3a1d096a20e986f/ss_dba4a3b3212b28345a5b2050d3a1d096a20e986f.600x338.jpg?t=1780767696"
                    alt="" />
            </div>
        </div>
    </div>

    <main class="container">
        <h1 aria-label="PearlByte">
            <span class="title-prefix">
                <span class="title-letters">
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">P</span></span></span>
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">e</span></span></span>
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">a</span></span></span>
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">r</span></span></span>
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">l</span></span></span>
                    <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                                class="title-character">B</span></span></span>
                </span>
            </span>
            <span class="title-ending">
                <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                            class="title-character">y</span></span></span>
                <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                            class="title-character">t</span></span></span>
                <span class="title-arrival" aria-hidden="true"><span class="title-letter"><span
                            class="title-character">e</span></span></span>
            </span>
        </h1>

        <div class="tagline">Making Goofy Games</div>

        <p class="construction-note">Website Under Construction.</p>

        <section class="link-panel" aria-labelledby="steam-heading">
            <h2 id="steam-heading">Steam Pages</h2>
            <div class="games">
                <a class="game-link" href="https://store.steampowered.com/app/2536120/Mousey/" target="_blank"
                    rel="noopener noreferrer">
                    Mousey
                </a>

                <a class="game-link" href="https://store.steampowered.com/app/4025210/Nest_of_Dust/" target="_blank"
                    rel="noopener noreferrer">
                    Nest of Dust
                </a>
            </div>
        </section>

        <section class="link-panel" aria-labelledby="discord-heading">
            <h2 id="discord-heading">Join the Discord Server</h2>
            <div class="discord-card" aria-label="Discord server invite">
                <img class="discord-icon"
                    src="https://cdn.discordapp.com/icons/929065007478620170/5c4990c14b597fa95c43c633315ff43a.png?size=128"
                    alt="" />
                <div class="discord-details">
                    <span class="discord-name">PearlByte</span>
                    <div class="discord-counts" aria-live="polite">
                        <span class="discord-count" id="discord-members">Loading members...</span>
                        <span class="discord-count discord-count--online" id="discord-online">Loading online...</span>
                    </div>
                </div>
                <a class="discord-join" href="https://discord.gg/7R7YTwwKHz" target="_blank" rel="noopener noreferrer">
                    Join
                </a>
            </div>
        </section>
    </main>

    <script>
        Promise.race([
            Promise.allSettled(
                Array.from(document.querySelectorAll(".screenshot-backdrop img"), (image) => image.decode())
            ),
            new Promise((resolve) => setTimeout(resolve, 2500))
        ]).then(() => {
            document.body.classList.add("is-ready");
        });

        fetch("https://discord.com/api/v10/invites/7R7YTwwKHz?with_counts=true")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Discord invite request failed (${response.status}).`);
                }
                return response.json();
            })
            .then((invite) => {
                const members = invite.approximate_member_count;
                const online = invite.approximate_presence_count;

                if (!Number.isFinite(members) || !Number.isFinite(online)) {
                    throw new Error("Discord did not return member counts for this invite.");
                }

                document.getElementById("discord-members").textContent = `${members} Members`;
                document.getElementById("discord-online").textContent = `${online} Online`;
            })
            .catch((error) => {
                console.error("Unable to load Discord member counts:", error);
                document.getElementById("discord-members").textContent = "Member count unavailable";
                document.getElementById("discord-online").remove();
            });
    </script>

</body>

</html>
